<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNWAHAS Sports Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
      .bg-stadium {
        background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 1)), url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
        background-size: cover; background-position: center;
      }
      .hide { display: none !important; }
      
      .nav-tab { transition: all 0.3s ease; border-bottom: 2px solid transparent; cursor: pointer; padding-bottom: 4px; }
      .nav-tab:hover { color: #fbbf24; }
      .nav-tab.active { border-bottom: 2px solid #fbbf24; color: #fbbf24; }
      
      .live-dot { animation: pulse 1.5s infinite; }
      @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      }

      .competition-logo, .team-logo-small {
        width: 24px; height: 24px; object-fit: contain;
        border-radius: 4px; background-color: transparent;
      }
      .team-logo-large {
        width: 80px; height: 80px; object-fit: contain;
      }
      
      .modal { display: none; }
      .modal.active { display: flex; }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">

    <nav class="bg-[#1e293b]/90 backdrop-blur-md border-b border-gray-700 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
        <div class="flex items-center gap-2 cursor-pointer transition transform hover:scale-105" onclick="goToHome()">
          <div class="bg-amber-500 text-black font-black px-2 py-1 rounded shadow-md">UWH</div>
          <span class="text-xl font-bold tracking-wider hidden sm:block">UNWAHAS</span>
        </div>
        
        <div class="flex items-center gap-4 sm:gap-6">
          <div class="hidden md:flex gap-6 text-sm font-semibold text-gray-300">
            <a href="#" class="nav-tab active" onclick="filterCategory('live')">Live</a>
            <a href="#" class="nav-tab" onclick="filterCategory('sepakbola')">Sepakbola</a>
            <a href="#" class="nav-tab" onclick="filterCategory('futsal')">Futsal</a>
          </div>
          
          <div id="admin-indicator" class="hidden items-center gap-2 bg-emerald-500/20 border border-emerald-500/50 px-3 py-1 rounded-full text-xs text-emerald-400">
            <i class="fa-solid fa-shield-halved"></i> Admin
            <button onclick="logoutAdmin()" class="ml-1 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
          </div>
          
          <button id="btn-login" onclick="openModal('loginModal')" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-3 sm:px-4 py-1.5 rounded text-xs sm:text-sm transition transform hover:scale-105 shadow-md">
            Admin Login
          </button>
        </div>
      </div>
    </nav>

    <!-- ================= HALAMAN 1: LANDING PAGE ================= -->
    <main id="page-landing" class="flex-grow bg-stadium flex flex-col items-center pt-8 sm:pt-10 px-2 sm:px-0">
      
      <div class="flex gap-4 sm:gap-8 mb-8">
        <div onclick="filterCategory('live')" id="cat-live" class="flex flex-col items-center gap-2 cursor-pointer group">
          <div class="w-12 h-12 sm:w-14 sm:h-14 bg-amber-500 rounded-full flex items-center justify-center text-black text-xl sm:text-2xl group-hover:scale-110 transition shadow-[0_0_15px_rgba(245,158,11,0.5)]"><i class="fa-solid fa-tower-broadcast"></i></div>
          <span class="text-xs font-semibold">Live</span>
        </div>
        <div onclick="filterCategory('sepakbola')" id="cat-sepakbola" class="flex flex-col items-center gap-2 cursor-pointer group opacity-60 hover:opacity-100 transition">
          <div class="w-12 h-12 sm:w-14 sm:h-14 bg-gray-700 rounded-full flex items-center justify-center text-white text-xl sm:text-2xl group-hover:scale-110 transition border border-gray-600"><i class="fa-solid fa-futbol"></i></div>
          <span class="text-xs font-semibold">Sepakbola</span>
        </div>
        <div onclick="filterCategory('futsal')" id="cat-futsal" class="flex flex-col items-center gap-2 cursor-pointer group opacity-60 hover:opacity-100 transition">
          <div class="w-12 h-12 sm:w-14 sm:h-14 bg-gray-700 rounded-full flex items-center justify-center text-white text-xl sm:text-2xl group-hover:scale-110 transition border border-gray-600"><i class="fa-solid fa-circle-notch"></i></div>
          <span class="text-xs font-semibold">Futsal</span>
        </div>
      </div>

      <div id="match-list-container" class="w-full max-w-4xl bg-[#1e293b]/95 backdrop-blur-md rounded-xl overflow-hidden shadow-2xl mb-10 border border-gray-700 transition-all duration-300">
        <!-- Dirender oleh JS -->
      </div>
    </main>

    <!-- ================= HALAMAN 2: DETAIL USER ================= -->
    <main id="page-user" class="hide flex-grow bg-[#0f172a] py-6 sm:py-8 px-4">
      <div class="max-w-5xl mx-auto">
        <button onclick="goToHome()" class="text-gray-400 hover:text-white mb-6 flex items-center gap-2 text-sm transition">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
        </button>

        <div class="bg-[#1e293b] rounded-2xl p-5 sm:p-10 shadow-xl border border-gray-700 relative overflow-hidden">
          
          <div class="text-center mb-6 sm:mb-8 flex justify-center items-center gap-2">
            <img src="" id="user-comp-logo" class="w-6 h-6 object-contain" alt="logo">
            <span class="bg-amber-500/20 text-amber-500 text-[10px] sm:text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30 uppercase tracking-widest" id="user-competition">-</span>
          </div>

          <div class="flex items-center justify-center gap-4 sm:gap-16 mb-8">
            <div class="flex flex-col items-center gap-2 sm:gap-3 w-1/3">
              <img src="" id="user-logoA" class="team-logo-large rounded-full shadow-lg border-2 border-gray-600 p-1 bg-gray-800">
              <h2 class="text-sm sm:text-2xl font-bold text-center leading-tight" id="user-teamA">-</h2>
            </div>
            
            <div class="text-center w-1/3">
              <div class="text-3xl sm:text-6xl font-black text-amber-500 tracking-wider" id="user-score">- - -</div>
              <div id="user-status" class="font-bold text-xs sm:text-sm mt-1 sm:mt-2 flex items-center justify-center gap-1 sm:gap-2"></div>
              <div class="text-xs text-gray-400 mt-2" id="user-time-range"></div>
            </div>

            <div class="flex flex-col items-center gap-2 sm:gap-3 w-1/3">
              <img src="" id="user-logoB" class="team-logo-large rounded-full shadow-lg border-2 border-gray-600 p-1 bg-gray-800">
              <h2 class="text-sm sm:text-2xl font-bold text-center leading-tight" id="user-teamB">-</h2>
            </div>
          </div>

          <div class="mt-8">
            <h3 class="text-sm font-bold text-gray-400 uppercase mb-3 border-b border-gray-700 pb-2"><i class="fa-solid fa-users mr-2"></i> Lineup & Formasi</h3>
            <div class="bg-[#0f172a] p-4 rounded-xl border border-gray-700 flex justify-center">
              <img src="" id="user-formation-img" class="w-full max-w-2xl rounded-lg shadow-lg hidden" alt="Formasi">

            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ================= HALAMAN 3: DETAIL ADMIN ================= -->
    <main id="page-admin" class="hide flex-grow bg-[#0f172a] py-6 sm:py-8 px-4">
      <div class="max-w-6xl mx-auto">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <button onclick="goToHome()" class="text-gray-400 hover:text-white flex items-center gap-2 text-sm transition">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
          </button>
          <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] sm:text-xs font-bold"><i class="fa-solid fa-lock-open mr-1"></i> Admin Control Panel</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
          
          <div class="lg:col-span-2 bg-[#1e293b] rounded-2xl p-5 sm:p-6 shadow-xl border border-gray-700 flex flex-col justify-center items-center">
            <h3 class="text-base sm:text-lg font-bold mb-4 border-b border-gray-700 pb-2 w-full text-center">Live Preview</h3>
            <div class="flex items-center justify-center gap-4 w-full mb-6">
              <div class="flex flex-col items-center gap-2 w-1/3">
                <img src="" id="admin-logoA" class="team-logo-large bg-gray-800 rounded-full border border-gray-600">
                <h2 class="text-sm sm:text-lg font-bold text-center leading-tight" id="admin-teamA">-</h2>
              </div>
              <div class="text-center w-1/3">
                <div class="text-3xl sm:text-4xl font-black text-amber-500" id="admin-score">- - -</div>
                <div id="admin-status" class="font-bold text-[10px] sm:text-xs mt-2"></div>
                <div class="text-xs text-gray-400 mt-1" id="admin-time-range"></div>
              </div>
              <div class="flex flex-col items-center gap-2 w-1/3">
                <img src="" id="admin-logoB" class="team-logo-large bg-gray-800 rounded-full border border-gray-600">
                <h2 class="text-sm sm:text-lg font-bold text-center leading-tight" id="admin-teamB">-</h2>
              </div>
            </div>
            <div class="w-full">
               <h4 class="text-xs text-gray-400 mb-2">Preview Gambar Formasi:</h4>
               <img src="" id="admin-preview-formation" class="w-full rounded border border-gray-600 hidden">
            </div>
          </div>

          <div class="lg:col-span-3 bg-[#1e293b] rounded-2xl p-5 sm:p-6 shadow-xl border border-gray-700 border-t-4 border-t-amber-500">
            <h3 class="text-base sm:text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-amber-500"></i> Edit Data Pertandingan</h3>
            
            <!-- PERHATIKAN: ID FORM INI ADALAH 'admin-form' -->
            <form id="admin-form" onsubmit="saveAdminData(event)" class="space-y-4">
              <input type="hidden" id="active-match-id">
              
              <!-- KOMPETISI & JADWAL -->
              <div class="bg-[#0f172a] p-3 rounded-lg border border-gray-700 grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-3">
                  <label class="block text-[10px] font-bold text-gray-400 mb-1">Nama Kompetisi</label>
                  <input type="text" id="input-competition" class="w-full bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm" required>
                </div>
                <div class="sm:col-span-1">
                  <label class="block text-[10px] font-bold text-gray-400 mb-1">Tgl & Jam Mulai</label>
                  <input type="datetime-local" id="input-schedule-start" class="w-full bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm" required>
                </div>
                <div class="sm:col-span-1">
                  <label class="block text-[10px] font-bold text-gray-400 mb-1">Jam Selesai</label>
                  <input type="datetime-local" id="input-schedule-end" class="w-full bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm" required>
                </div>
                <div class="sm:col-span-1">
                  <label class="block text-[10px] font-bold text-gray-400 mb-1">Kategori</label>
                  <select id="input-category" class="w-full bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm">
                    <option value="sepakbola">Sepakbola</option>
                    <option value="futsal">Futsal</option>
                  </select>
                </div>
              </div>

              <!-- LOGO & NAMA TIM A -->
              <div class="bg-[#0f172a] p-3 rounded-lg border border-gray-700">
                <label class="block text-[10px] font-bold text-gray-400 mb-1">Tim A (Kiri)</label>
                <div class="flex gap-2 mb-2">
                  <input type="text" id="input-teamA" class="flex-grow bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm" required>
                  <input type="number" id="input-scoreA" class="w-16 bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm text-center font-bold" required>
                </div>
                <div class="flex items-center gap-2">
                  <label class="text-[10px] text-gray-500">Ganti Logo:</label>
                  <input type="file" id="input-logoA" accept="image/*" class="text-xs text-gray-400 file:bg-gray-700 file:text-white file:border-0 file:rounded file:px-2 file:py-1">
                </div>
              </div>

              <!-- LOGO & NAMA TIM B -->
              <div class="bg-[#0f172a] p-3 rounded-lg border border-gray-700">
                <label class="block text-[10px] font-bold text-gray-400 mb-1">Tim B (Kanan)</label>
                <div class="flex gap-2 mb-2">
                  <input type="text" id="input-teamB" class="flex-grow bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm" required>
                  <input type="number" id="input-scoreB" class="w-16 bg-[#1e293b] border border-gray-600 rounded px-3 py-1.5 text-sm text-center font-bold" required>
                </div>
                <div class="flex items-center gap-2">
                  <label class="text-[10px] text-gray-500">Ganti Logo:</label>
                  <input type="file" id="input-logoB" accept="image/*" class="text-xs text-gray-400 file:bg-gray-700 file:text-white file:border-0 file:rounded file:px-2 file:py-1">
                </div>
              </div>

              <!-- LOGO KOMPETISI -->
              <div class="bg-[#0f172a] p-3 rounded-lg border border-gray-700 flex items-center justify-between">
                <div>
                  <label class="block text-[10px] font-bold text-gray-400 mb-1">Logo Kompetisi</label>
                  <input type="file" id="input-comp-logo" accept="image/*" class="text-xs text-gray-400 file:bg-gray-700 file:text-white file:border-0 file:rounded file:px-2 file:py-1">
                </div>
                <img src="" id="admin-comp-logo-preview" class="w-10 h-10 object-contain bg-gray-800 rounded">
              </div>

              <!-- GAMBAR FORMASI -->
              <div class="bg-[#0f172a] p-3 rounded-lg border border-gray-700">
                <label class="block text-[10px] font-bold text-gray-400 mb-1">Gambar Formasi / Lineup Lapangan</label>
                <input type="file" id="input-formation-img" accept="image/*" class="w-full text-xs text-gray-400 file:bg-gray-700 file:text-white file:border-0 file:rounded file:px-2 file:py-1">
              </div>

              <!-- TOMBOL SIMPAN (Type Submit) -->
              <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-lg transition mt-2 transform active:scale-95 shadow-lg cursor-pointer">SIMPAN SEMUA PERUBAHAN</button>
            </form>
          </div>

        </div>
      </div>
    </main>

    <!-- MODAL LOGIN -->
    <div id="loginModal" class="modal fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] items-center justify-center p-4">
      <div class="bg-[#1e293b] border border-gray-700 rounded-2xl w-full max-w-sm p-6 relative shadow-2xl">
        <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
            <i class="fa-solid fa-lock text-2xl text-amber-500"></i>
          </div>
          <h3 class="text-xl font-bold">Admin Login</h3>
          <p class="text-sm text-gray-400 mt-1">Password: <span class="text-amber-400 font-mono">admin123</span></p>
        </div>
        <form onsubmit="handleLogin(event)">
          <input type="password" id="adminPass" placeholder="Masukkan Password" class="w-full px-4 py-3 bg-[#0f172a] border border-gray-600 rounded-xl mb-4 text-white text-center focus:outline-none focus:border-amber-500" required>
          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-xl transition cursor-pointer">Masuk</button>
        </form>
      </div>
    </div>

    <script>
      // === DATA DEFAULT ===
      const defaultMatches = {
        'm1': { 
          competition: 'Piala Dunia U17', 
          scheduleStart: '2024-11-25T22:30', 
          scheduleEnd: '2024-11-26T00:30', 
          teamA: 'Honduras U17', logoA: '', scoreA: 0, 
          teamB: 'Kolombia U17', logoB: '', scoreB: 0, 
          compLogo: 'https://upload.wikimedia.org/wikipedia/en/e/e3/2022_FIFA_World_Cup.svg',
          formationImg: '', category: 'sepakbola'
        },
        'm2': { 
          competition: 'Piala Dunia U17', 
          scheduleStart: '2024-11-20T20:00', 
          scheduleEnd: '2024-11-20T22:00', 
          teamA: 'Teknik FC', logoA: 'https://cdn-icons-png.flaticon.com/512/53/53283.png', scoreA: 10, 
          teamB: 'Hukum United', logoB: 'https://cdn-icons-png.flaticon.com/512/53/53283.png', scoreB: 1, 
          compLogo: 'https://upload.wikimedia.org/wikipedia/en/e/e3/2022_FIFA_World_Cup.svg',
          formationImg: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Football_pitch_isometric.svg/1200px-Football_pitch_isometric.svg.png',
          category: 'sepakbola'
        },
        'm3': { 
          competition: 'AFC Futsal Championship', 
          scheduleStart: '2024-11-25T23:00', 
          scheduleEnd: '2024-11-26T01:00', 
          teamA: 'Al-Ahli Dubai', logoA: '', scoreA: 3, 
          teamB: 'Al Qadisiyah', logoB: '', scoreB: 0, 
          compLogo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/AFC_Champions_League_logo.svg/200px-AFC_Champions_League_logo.svg.png',
          formationImg: '', category: 'futsal'
        }
      };

      let matchesData = JSON.parse(localStorage.getItem('unwahas_matches_v2')) || defaultMatches;
      let isAdmin = false;
      let currentMatchId = null;
      let currentCategory = 'live';

      function saveToStorage() {
        localStorage.setItem('unwahas_matches_v2', JSON.stringify(matchesData));
      }

      function getAutoStatus(match) {
        const now = new Date();
        const start = new Date(match.scheduleStart);
        const end = new Date(match.scheduleEnd);
        
        if (now >= start && now <= end) return 'live';
        if (now > end) return 'finished';
        return 'upcoming';
      }

      function formatTime(dateStr) {
        if(!dateStr) return '--:--';
        const d = new Date(dateStr);
        return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
      }

      function renderLanding() {
        const container = document.getElementById('match-list-container');
        container.innerHTML = '';

        const filteredMatches = Object.keys(matchesData).filter(key => {
          const m = matchesData[key];
          if (currentCategory === 'live') return true;
          return m.category === currentCategory;
        });

        if (filteredMatches.length === 0) {
          container.innerHTML = `<div class="p-8 text-center text-gray-500 italic">Tidak ada pertandingan untuk kategori ini.</div>`;
          return;
        }

        const grouped = {};
        filteredMatches.forEach(key => {
          const m = matchesData[key];
          if (!grouped[m.competition]) grouped[m.competition] = { logo: m.compLogo, matches: [] };
          grouped[m.competition].matches.push({ id: key, ...m });
        });

        for (const compName in grouped) {
          const group = grouped[compName];
          
          let html = `
            <div class="bg-[#0f172a] px-4 py-2 flex justify-between items-center border-b border-gray-700 border-t mt-1">
              <div class="flex items-center gap-3 text-sm font-bold text-gray-300">
                ${group.logo ? `<img src="${group.logo}" class="competition-logo">` : '<i class="fa-solid fa-trophy text-amber-500"></i>'}
                <span>${compName}</span>
              </div>
              <div class="text-xs text-gray-400">1 X 2</div>
            </div>
          `;

          group.matches.forEach(m => {
            const status = getAutoStatus(m);
            const isLive = status === 'live';
            
            const timeStart = formatTime(m.scheduleStart);
            const timeEnd = formatTime(m.scheduleEnd);
            
            const defLogo = 'https://cdn-icons-png.flaticon.com/512/53/53283.png';
            const logoA = m.logoA || defLogo;
            const logoB = m.logoB || defLogo;

            html += `
              <div onclick="openMatch('${m.id}')" class="flex items-center justify-between px-3 sm:px-4 py-3 border-b border-gray-700/50 hover:bg-gray-800/50 cursor-pointer transition group ${isLive ? 'bg-red-900/10' : ''}">
                <div class="w-20 sm:w-24 flex items-center gap-2">
                  ${isLive 
                    ? `<span class="live-dot w-2 h-2 bg-red-500 rounded-full"></span><span class="text-xs text-red-400 font-bold">LIVE</span>` 
                    : `<span class="text-xs sm:text-sm text-gray-400 font-medium">${timeStart} - ${timeEnd}</span>`
                  }
                </div>
                <div class="flex-grow flex items-center justify-end gap-2 sm:gap-3 text-xs sm:text-sm font-semibold">
                  <span class="truncate max-w-[80px] sm:max-w-none">${m.teamA}</span>
                  <img src="${logoA}" class="w-5 h-5 sm:w-6 sm:h-6 object-contain">
                  <span class="text-amber-500 font-bold text-sm sm:text-base mx-1 sm:mx-2">${m.scoreA} - ${m.scoreB}</span>
                  <img src="${logoB}" class="w-5 h-5 sm:w-6 sm:h-6 object-contain">
                  <span class="truncate max-w-[80px] sm:max-w-none">${m.teamB}</span>
                </div>
                <div class="flex items-center gap-2 sm:gap-3 w-12 sm:w-16 justify-end">
                  <i class="fa-regular fa-star text-gray-500 hover:text-amber-500"></i>
                </div>
              </div>
            `;
          });
          container.innerHTML += html;
        }
      }

      function showPage(pageId) {
        document.getElementById('page-landing').classList.add('hide');
        document.getElementById('page-user').classList.add('hide');
        document.getElementById('page-admin').classList.add('hide');
        document.getElementById(pageId).classList.remove('hide');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function goToHome() {
        showPage('page-landing');
        renderLanding();
      }

      function filterCategory(cat) {
        currentCategory = cat;
        ['live', 'sepakbola', 'futsal'].forEach(c => {
          const el = document.getElementById(`cat-${c}`);
          if (el) {
            el.classList.remove('opacity-100');
            el.classList.add('opacity-60');
            el.querySelector('div').classList.replace('bg-amber-500', 'bg-gray-700');
            el.querySelector('div').classList.replace('text-black', 'text-white');
          }
        });

        const activeEl = document.getElementById(`cat-${cat}`);
        if (activeEl) {
          activeEl.classList.remove('opacity-60');
          activeEl.classList.add('opacity-100');
          activeEl.querySelector('div').classList.replace('bg-gray-700', 'bg-amber-500');
          activeEl.querySelector('div').classList.replace('text-white', 'text-black');
        }
        
        renderLanding();
      }

      function openMatch(matchId) {
        currentMatchId = matchId;
        const data = matchesData[matchId];
        const status = getAutoStatus(data);
        const defLogo = 'https://cdn-icons-png.flaticon.com/512/53/53283.png';
        
        const timeStart = formatTime(data.scheduleStart);
        const timeEnd = formatTime(data.scheduleEnd);

        if (isAdmin) {
          document.getElementById('active-match-id').value = matchId;
          document.getElementById('input-competition').value = data.competition;
          
          // FIX DATETIME-LOCAL: Pastikan formatnya YYYY-MM-DDTHH:mm
          document.getElementById('input-schedule-start').value = data.scheduleStart || '';
          document.getElementById('input-schedule-end').value = data.scheduleEnd || '';
          
          document.getElementById('input-category').value = data.category;
          
          document.getElementById('input-teamA').value = data.teamA;
          document.getElementById('input-scoreA').value = data.scoreA;
          document.getElementById('admin-logoA').src = data.logoA || defLogo;
          
          document.getElementById('input-teamB').value = data.teamB;
          document.getElementById('input-scoreB').value = data.scoreB;
          document.getElementById('admin-logoB').src = data.logoB || defLogo;
          
          document.getElementById('admin-comp-logo-preview').src = data.compLogo || '';
          
          const formPrev = document.getElementById('admin-preview-formation');
          if (data.formationImg) {
            formPrev.src = data.formationImg;
            formPrev.classList.remove('hidden');
          } else {
            formPrev.classList.add('hidden');
          }

          document.getElementById('admin-teamA').innerText = data.teamA;
          document.getElementById('admin-score').innerText = `${data.scoreA} - ${data.scoreB}`;
          document.getElementById('admin-teamB').innerText = data.teamB;
          document.getElementById('admin-time-range').innerText = `${timeStart} - ${timeEnd}`;
          updateStatusDisplay('admin-status', status);
          
          // Reset input file setiap kali buka halaman agar tidak nyangkut
          document.getElementById('input-logoA').value = '';
          document.getElementById('input-logoB').value = '';
          document.getElementById('input-comp-logo').value = '';
          document.getElementById('input-formation-img').value = '';
          
          showPage('page-admin');
        } else {
          document.getElementById('user-comp-logo').src = data.compLogo || '';
          document.getElementById('user-competition').innerText = data.competition;
          
          document.getElementById('user-teamA').innerText = data.teamA;
          document.getElementById('user-logoA').src = data.logoA || defLogo;
          document.getElementById('user-score').innerText = `${data.scoreA} - ${data.scoreB}`;
          document.getElementById('user-teamB').innerText = data.teamB;
          document.getElementById('user-logoB').src = data.logoB || defLogo;
          document.getElementById('user-time-range').innerText = `${timeStart} - ${timeEnd}`;
          updateStatusDisplay('user-status', status);

          const formImg = document.getElementById('user-formation-img');
          const formText = document.getElementById('user-formation-text');
          
          if (data.formationImg) {
            formImg.src = data.formationImg;
            formImg.classList.remove('hidden');
            formText.classList.add('hidden');
          } else {
            formImg.classList.add('hidden');
            formText.classList.remove('hidden');
          }
          
          showPage('page-user');
        }
      }

      function updateStatusDisplay(elementId, status) {
        const el = document.getElementById(elementId);
        if (status === 'live') {
          el.innerHTML = `<span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> LIVE`;
          el.className = "text-red-400 font-bold text-[10px] sm:text-sm mt-1 flex items-center justify-center gap-2";
        } else if (status === 'finished') {
          el.innerHTML = `<i class="fa-solid fa-check-circle text-emerald-500"></i> SELESAI`;
          el.className = "text-emerald-400 font-bold text-[10px] sm:text-sm mt-1 flex items-center justify-center gap-2";
        } else {
          el.innerHTML = `<i class="fa-solid fa-clock"></i> AKAN DATANG`;
          el.className = "text-gray-400 font-bold text-[10px] sm:text-sm mt-1 flex items-center justify-center gap-2";
        }
      }

      function openModal(id) { document.getElementById(id).classList.add('active'); }
      function closeModal(id) { document.getElementById(id).classList.remove('active'); }

      function handleLogin(e) {
        e.preventDefault();
        const pass = document.getElementById('adminPass').value;
        if (pass === 'admin123') {
          isAdmin = true;
          document.body.classList.add('admin');
          document.getElementById('btn-login').classList.add('hide');
          document.getElementById('admin-indicator').classList.remove('hide');
          document.getElementById('admin-indicator').classList.add('flex');
          closeModal('loginModal');
          
          if (!document.getElementById('page-user').classList.contains('hide')) {
            openMatch(currentMatchId);
          }
        } else {
          alert("Password Salah! (admin123)");
        }
        document.getElementById('adminPass').value = '';
      }

      function logoutAdmin() {
        isAdmin = false;
        document.body.classList.remove('admin');
        document.getElementById('btn-login').classList.remove('hide');
        document.getElementById('admin-indicator').classList.add('hide');
        document.getElementById('admin-indicator').classList.remove('flex');
        if (!document.getElementById('page-admin').classList.contains('hide')) {
           goToHome();
        }
      }

      // === FUNGSI SIMPAN (SUDAH DIPERBAIKI TOTAL) ===
      function readFileAsDataURL(file) {
        return new Promise((resolve) => {
          if (!file) return resolve(null);
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

      async function saveAdminData(e) {
        e.preventDefault(); // Mencegah halaman reload
        
        const id = document.getElementById('active-match-id').value;
        const match = matchesData[id];

        // 1. Ambil data teks
        match.competition = document.getElementById('input-competition').value;
        match.scheduleStart = document.getElementById('input-schedule-start').value;
        match.scheduleEnd = document.getElementById('input-schedule-end').value;
        match.category = document.getElementById('input-category').value;
        
        match.teamA = document.getElementById('input-teamA').value;
        match.scoreA = parseInt(document.getElementById('input-scoreA').value) || 0;
        match.teamB = document.getElementById('input-teamB').value;
        match.scoreB = parseInt(document.getElementById('input-scoreB').value) || 0;

        // 2. Ambil file jika ada
        const fileA = document.getElementById('input-logoA').files[0];
        const fileB = document.getElementById('input-logoB').files[0];
        const fileComp = document.getElementById('input-comp-logo').files[0];
        const fileForm = document.getElementById('input-formation-img').files[0];

        // 3. Proses file (Tunggu sampai semua selesai dibaca)
        if (fileA) match.logoA = await readFileAsDataURL(fileA);
        if (fileB) match.logoB = await readFileAsDataURL(fileB);
        if (fileComp) match.compLogo = await readFileAsDataURL(fileComp);
        if (fileForm) match.formationImg = await readFileAsDataURL(fileForm);

        // 4. Simpan ke LocalStorage
        saveToStorage();
        
        // 5. Tampilkan notifikasi sukses
        alert("Data & Gambar Berhasil Disimpan Permanen!");
        
        // 6. Refresh Tampilan Admin dan Halaman Utama
        openMatch(id);
        renderLanding();
      }

      document.addEventListener('DOMContentLoaded', () => {
        filterCategory('live');
        
        // Cek status secara berkala tanpa membuat gambar kedip
        setInterval(() => {
            if(!document.getElementById('page-landing').classList.contains('hide')) {
                renderLanding();
            }
        }, 60000); // 1 menit sekali
      });

    </script>
  </body>
</html>
